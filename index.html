<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Yi Ding, SLAI &amp; BUPT. Interests in AI infrastructure and computer architecture.">
    <meta name="theme-color" content="#ffffff">
    <title>Yi Ding | AI Infrastructure &amp; Computer Architecture</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #ffffff;
        --ink: #172f4c;
        --text: #334155;
        --muted: #596779;
        --accent: #245ba8;
        --line: #e1e7ef;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--text);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100% - 48px, 760px);
        margin: clamp(72px, 16vh, 160px) auto 64px;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        font-size: clamp(56px, 9vw, 80px);
        font-weight: 400;
        line-height: 1.12;
        letter-spacing: -0.045em;
      }

      .affiliation { margin: 18px 0 0; color: var(--muted); }

      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 48px;
        margin-top: 56px;
        padding-top: 32px;
        border-top: 1px solid var(--line);
      }

      h2 {
        margin: 0 0 16px;
        color: var(--ink);
        font-size: 17px;
        font-weight: 600;
      }

      p { margin: 0; }
      ul { margin: 0; padding: 0; list-style: none; }
      li + li { margin-top: 6px; }

      a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-color: #b6c9e3;
        text-underline-offset: 5px;
        text-decoration-thickness: 1px;
        overflow-wrap: anywhere;
      }

      a:hover { text-decoration-color: currentColor; }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
        border-radius: 2px;
      }

      .contact a { display: inline-block; padding: 5px 0; }
      .contact li + li { margin-top: 0; }

      footer { margin-top: 64px; font-size: 14px; }

      @media (max-width: 560px) {
        .details { grid-template-columns: 1fr; gap: 30px; margin-top: 40px; }
        .contact a { padding: 9px 0; }
        footer { margin-top: 44px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Yi Ding</h1>
        <p class="affiliation">SLAI &amp; BUPT</p>
      </header>

      <div class="details">
        <section aria-labelledby="interests-heading">
          <h2 id="interests-heading">Research interests</h2>
          <ul>
            <li>AI infrastructure</li>
            <li>Computer architecture</li>
          </ul>
        </section>

        <section class="contact" aria-labelledby="contact-heading">
          <h2 id="contact-heading">Contact</h2>
          <ul>
            <li><a href="mailto:dingyi@bupt.edu.cn">dingyi@bupt.edu.cn</a></li>
            <li><a href="mailto:yiding@slai.edu.cn">yiding@slai.edu.cn</a></li>
          </ul>
        </section>
      </div>

      <footer>
        <a href="https://github.com/BinaryCheater">GitHub</a>
      </footer>
    </main>
  </body>
</html>
